<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>To Do List</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />

    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <nav class="navbar bg-primary px-5">
        <div class="navbar-brand fw-bold text-light">To Do List</div>
      </nav>
    </header>

    <main>
      <section class="container rounded shadow border p-3 mt-3">
        <div class="d-flex gap-3">
          <input
            type="text"
            placeholder="Add Your Task here"
            id="taskInput"
            class="form-control"
          />
          <button class="btn btn-primary text-nowrap" onclick="AddTask()">
            Add Task
          </button>
        </div>
      </section>
      <section class="container rounded shadow border p-3 mt-3">
        <ol id="TaskList">
          <!-- <li class="p-2">
            <span>abcd</span>
            <button class="btn btn-danger btn-sm mx-3">Delete</button>
          </li> -->
        </ol>
      </section>
    </main>

    <!-- Scripts -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <script src="script.js"></script>
  </body>
</html>
